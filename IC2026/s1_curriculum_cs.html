<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standard 1 - Computer Science</title>
  <link rel="stylesheet" href="standard-content.css" />
  <style>
    body {
      margin: 0;
      background: #f5f8fc;
    }

    main {
      padding: 1rem 1rem 2rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .toolbar a {
      display: inline-block;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      background: #0b4f8a;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .toolbar a:hover {
      background: #083d69;
    }

    .pdf-wrap {
      background: #fff;
      border: 1px solid #dfeaf7;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(18, 41, 67, 0.08);
    }

    iframe {
      display: block;
      width: 100%;
      min-height: 92vh;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <a href="Standard1.pdf" target="_blank" rel="noopener">Open PDF in new tab</a>
    </div>

    <div class="pdf-wrap">
      <iframe src="Standard1.pdf" title="Standard 1 Computer Science PDF"></iframe>
    </div>
  </main>
</body>
</html>
