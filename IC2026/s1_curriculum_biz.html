<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standard 1 - Business</title>
  <link rel="stylesheet" href="standard-content.css" />
  <style>
    body {
      background: #f5f8fc;
    }

    main {
      padding: 1rem 1rem 2rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .doc-tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .doc-tabs button {
      padding: 0.5rem 0.9rem;
      border: 1px solid #0b4f8a;
      border-radius: 999px;
      background: #fff;
      color: #0b4f8a;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .doc-tabs button:hover {
      background: #e8f1fb;
    }

    .doc-tabs button.active {
      background: #0b4f8a;
      color: #fff;
    }

    .toolbar a {
      display: inline-block;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      background: #0b4f8a;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .toolbar a:hover {
      background: #083d69;
    }

    .pdf-wrap {
      overflow: hidden;
      border: 1px solid #dfeaf7;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 24px rgba(18, 41, 67, 0.08);
    }

    iframe {
      display: block;
      width: 100%;
      min-height: 92vh;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">s1_curriculum_biz.html</span>
    <h1>Standard 1 - Business Evidence</h1>
    <ul>
      <li>Business course syllabus and pacing guide</li>
      <li>Classroom projects and exemplars</li>
      <li>Industry and employability integration artifacts</li>
    </ul>
    <div class="toolbar">
      <div class="doc-tabs" role="tablist" aria-label="Standard 1 Business documents">
        <button type="button" class="active" data-file="../images/S1_business_Syllabi.pdf" data-title="Business Syllabi">Syllabi</button>
        <button type="button" data-file="../images/S1_business_Pacing.pdf" data-title="Business Pacing Guide">Pacing Guide</button>
        <button type="button" data-file="../images/S1_business_shrt_projects.pdf" data-title="Business Short Projects">Short Projects</button>
        <button type="button" data-file="../images/S1_business_FBLA.pdf" data-title="Business FBLA">FBLA</button>
      </div>
      <a id="openNewTab" href="../images/S1_business_Syllabi.pdf" target="_blank" rel="noopener">Open PDF in new tab</a>
    </div>
    <div class="pdf-wrap">
      <iframe id="pdfFrame" src="../images/S1_business_Syllabi.pdf" title="Business Syllabi"></iframe>
    </div>
    <script>
      const tabs = document.querySelectorAll('.doc-tabs button[data-file]');
      const frame = document.getElementById('pdfFrame');
      const openLink = document.getElementById('openNewTab');

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          const file = tab.dataset.file;
          const title = tab.dataset.title;

          tabs.forEach((item) => item.classList.remove('active'));
          tab.classList.add('active');

          frame.src = file;
          frame.title = title;
          openLink.href = file;
        });
      });
    </script>
  </main>
</body>
</html>
