<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standard 3 - Advisory Committee</title>
  <link rel="stylesheet" href="standard-content.css" />
  <style>
    body {
      margin: 0;
      background: #f5f8fc;
    }

    main {
      padding: 1rem 1rem 2rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .doc-tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .doc-tabs button {
      display: inline-block;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      border: 1px solid #0b4f8a;
      background: #fff;
      color: #0b4f8a;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .doc-tabs button:hover {
      background: #e8f1fb;
    }

    .doc-tabs button.active {
      background: #0b4f8a;
      color: #fff;
    }

    .doc-tabs button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: #9fb6ca;
      color: #6b7f91;
      background: #eef2f6;
    }

    .toolbar a {
      display: inline-block;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      background: #0b4f8a;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .toolbar a:hover {
      background: #083d69;
    }

    .pdf-wrap {
      background: #fff;
      border: 1px solid #dfeaf7;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(18, 41, 67, 0.08);
    }

    iframe {
      display: block;
      width: 100%;
      min-height: 92vh;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <div class="doc-tabs" role="tablist" aria-label="Standard 3 documents">
        <button type="button" class="active" data-file="S3_AdvisoryCommittee.pdf" data-title="Advisory Committee Roster">Advisory Committee</button>
        <button type="button" data-file="Standard3_Survey.pdf" data-title="Standard 3 Survey">Survey</button>
        <button type="button" disabled title="Not updated yet">Activities (coming soon)</button>
      </div>
      <a id="openNewTab" href="S3_AdvisoryCommittee.pdf" target="_blank" rel="noopener">Open PDF in new tab</a>
    </div>

    <div class="pdf-wrap">
      <iframe id="pdfFrame" src="S3_AdvisoryCommittee.pdf" title="Advisory Committee Roster"></iframe>
    </div>
  </main>

  <script>
    const tabs = document.querySelectorAll('.doc-tabs button[data-file]');
    const frame = document.getElementById('pdfFrame');
    const openLink = document.getElementById('openNewTab');

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        const file = tab.dataset.file;
        const title = tab.dataset.title;

        tabs.forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');

        frame.src = file;
        frame.title = title;
        openLink.href = file;
      });
    });
  </script>
</body>
</html>
